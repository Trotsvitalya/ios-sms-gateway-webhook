name: Build IPA for TrollStore

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project SMSGateway.xcodeproj \
            -scheme SMSGateway \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SMSGateway.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package & Sign IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/SMSGateway.xcarchive/Products/Applications/SMSGateway.app Payload/
          ldid -SSMSGateway/App.entitlements Payload/SMSGateway.app/SMSGateway
          zip -vr SMSGateway.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSGateway
          path: SMSGateway.ipa

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SMSGateway.ipa
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: SMS Gateway iOS v1.0.0 (TrollStore)
          body: |
            ## SMS Gateway для iOS 15–16 (TrollStore)

            ### Як встановити:
            1. Завантажте `SMSGateway.ipa` на ваш iPhone.
            2. Відкрийте завантажений файл у програмі **TrollStore**.
            3. Натисніть **Install**.
            4. Запустіть додаток, налаштуйте Webhook URL і увімкніть перемикач «Сервіс активний».
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
